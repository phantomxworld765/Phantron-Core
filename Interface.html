<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PHANTRON v7 — P7</title>
<style>
  :root{
    --bg:#05080f; --panel:#0b1220cc; --line:#13243f;
    --cyan:#22d3ee; --cyan2:#38bdf8; --green:#34d399; --red:#f87171;
    --txt:#dbe7ff; --dim:#6b86b0; --accent:#0ea5e9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Segoe UI",system-ui,Arial,sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, #0b2238 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 110%, #07283a 0%, transparent 55%),
      var(--bg);
    color:var(--txt); height:100vh; overflow:hidden;
  }
  .grid{
    display:grid; height:100vh; gap:12px; padding:12px;
    grid-template-columns:300px 1fr 340px;
    grid-template-rows:64px 1fr;
    grid-template-areas:"head head head" "left center right";
  }
  /* ---------- header ---------- */
  header{
    grid-area:head; display:flex; align-items:center; gap:16px;
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:0 20px; backdrop-filter:blur(8px);
  }
  .logo{display:flex;align-items:center;gap:12px}
  .orb{
    width:34px;height:34px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,var(--cyan),#0b6e8a 70%,#062c3a);
    box-shadow:0 0 18px var(--cyan),inset 0 0 8px #0008; animation:pulse 2.4s infinite;
  }
  @keyframes pulse{0%,100%{box-shadow:0 0 12px var(--cyan)}50%{box-shadow:0 0 26px var(--cyan)}}
  .logo h1{font-size:20px;letter-spacing:4px;font-weight:700}
  .logo small{color:var(--dim);letter-spacing:2px;font-size:11px}
  .status{margin-left:auto;display:flex;align-items:center;gap:18px;font-size:12px;color:var(--dim)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--red);display:inline-block;margin-right:6px}
  .dot.on{background:var(--green);box-shadow:0 0 10px var(--green)}
  .clock{font-variant-numeric:tabular-nums;color:var(--cyan2)}
  /* ---------- panels ---------- */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    backdrop-filter:blur(8px);display:flex;flex-direction:column;overflow:hidden}
  .panel h2{font-size:11px;letter-spacing:2px;color:var(--cyan2);
    padding:12px 14px;border-bottom:1px solid var(--line);text-transform:uppercase}
  .left{grid-area:left;display:flex;flex-direction:column;gap:12px}
  .right{grid-area:right;display:flex;flex-direction:column;gap:12px}
  .center{grid-area:center;display:flex;flex-direction:column}
  /* ---------- gauges ---------- */
  .gauges{padding:14px;display:flex;flex-direction:column;gap:16px}
  .gauge{display:flex;align-items:center;gap:14px}
  .ring{position:relative;width:70px;height:70px;flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring .val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:700;color:var(--cyan)}
  .gauge .meta{font-size:12px;color:var(--dim)}
  .gauge .meta b{display:block;color:var(--txt);font-size:13px;letter-spacing:1px}
  /* ---------- screen ---------- */
  .screen-wrap{padding:10px;flex:1;display:flex;flex-direction:column}
  #screen{width:100%;border-radius:10px;border:1px solid var(--line);background:#02060c;
    aspect-ratio:16/9;object-fit:cover}
  .noscreen{flex:1;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px}
  /* ---------- chat ---------- */
  .chat{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:78%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.5;
    white-space:pre-wrap;word-break:break-word;animation:rise .25s ease}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .msg.user{align-self:flex-end;background:linear-gradient(135deg,#0e7490,#0369a1);color:#eaffff;
    border-bottom-right-radius:4px}
  .msg.ai{align-self:flex-start;background:#0c1830;border:1px solid var(--line);
    border-bottom-left-radius:4px}
  .msg.step{align-self:flex-start;background:#0a1426;border:1px dashed #21507a;color:var(--cyan2);
    font-size:13px}
  .msg.sys{align-self:center;background:#06283a;color:var(--cyan);font-size:12px;letter-spacing:1px}
  .msg .tag{font-size:10px;letter-spacing:1px;opacity:.6;display:block;margin-bottom:2px}
  .typing{align-self:flex-start;display:flex;gap:5px;padding:12px 16px;background:#0c1830;
    border:1px solid var(--line);border-radius:14px}
  .typing span{width:7px;height:7px;border-radius:50%;background:var(--cyan);animation:blink 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
  /* ---------- input ---------- */
  .inputbar{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line)}
  #txt{flex:1;background:#02080f;border:1px solid var(--line);border-radius:12px;
    padding:13px 16px;color:var(--txt);font-size:14px;outline:none}
  #txt:focus{border-color:var(--cyan);box-shadow:0 0 0 2px #22d3ee22}
  button{cursor:pointer;border:none;border-radius:12px;font-size:14px;color:#001018;font-weight:700}
  #send{padding:0 22px;background:linear-gradient(135deg,var(--cyan),var(--accent))}
  #mic{width:52px;background:#0c1830;color:var(--cyan);border:1px solid var(--line);font-size:20px}
  #mic.live{background:var(--red);color:#fff;box-shadow:0 0 16px var(--red);animation:pulse 1s infinite}
  /* ---------- activity ---------- */
  .log{padding:6px 12px;overflow-y:auto;flex:1}
  .logitem{display:flex;gap:8px;padding:8px 4px;border-bottom:1px solid #0d1a2e;font-size:12px}
  .logitem .t{color:var(--dim);font-variant-numeric:tabular-nums;flex:none}
  .logitem .a{color:var(--txt)}
  .logitem .d{color:var(--dim);display:block;font-size:11px}
  .logitem.tool .a{color:var(--cyan2)} .logitem.done .a{color:var(--green)}
  .logitem.error .a{color:var(--red)}
  ::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#16304f;border-radius:8px}
  .hint{padding:8px 14px;font-size:11px;color:var(--dim)}

  /* ===================== CYBERPUNK / JARVIS FX ===================== */
  /* animated background grid */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(34,211,238,.06) 1px,transparent 1px),
      linear-gradient(90deg,rgba(34,211,238,.06) 1px,transparent 1px);
    background-size:40px 40px;
    mask-image:radial-gradient(circle at 50% 40%,#000 0%,transparent 80%);
    animation:gridmove 12s linear infinite;
  }
  @keyframes gridmove{from{background-position:0 0}to{background-position:40px 40px}}
  /* moving scanlines + subtle flicker */
  .scanlines{
    position:fixed;inset:0;z-index:9998;pointer-events:none;
    background:repeating-linear-gradient(to bottom,
      rgba(0,0,0,0) 0px,rgba(0,0,0,0) 2px,rgba(0,0,0,.10) 3px,rgba(0,0,0,0) 4px);
    mix-blend-mode:overlay;opacity:.5;
  }
  .grid{position:relative;z-index:1}
  /* title glow + glitch */
  .logo h1{
    color:#eafdff;text-shadow:0 0 8px var(--cyan),0 0 22px #0891b2;
    position:relative;
  }
  .logo h1::after{
    content:"PHANTRON";position:absolute;left:0;top:0;color:#ff2e88;
    clip-path:inset(0 0 55% 0);opacity:.5;
    animation:glitch 3.6s infinite steps(2);
  }
  @keyframes glitch{
    0%,92%,100%{transform:translate(0,0)}
    93%{transform:translate(-2px,1px)}95%{transform:translate(2px,-1px)}
    97%{transform:translate(-1px,0)}
  }
  /* boot sequence overlay */
  #boot{
    position:fixed;inset:0;z-index:10000;background:#02050b;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;transition:opacity .8s ease;font-family:"Consolas",monospace;
  }
  #boot.gone{opacity:0;pointer-events:none}
  #boot .core{
    width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle at 50% 50%,var(--cyan),#06384a 60%,transparent 72%);
    box-shadow:0 0 40px var(--cyan),inset 0 0 30px #000;
    animation:spin 3s linear infinite,pulse 1.6s ease-in-out infinite;
    position:relative;
  }
  #boot .core::before,#boot .core::after{
    content:"";position:absolute;inset:-14px;border-radius:50%;
    border:1px solid rgba(34,211,238,.4);border-top-color:var(--cyan);
    animation:spin 2.2s linear infinite;
  }
  #boot .core::after{inset:-28px;border:1px dashed rgba(56,189,248,.3);animation-duration:4s;animation-direction:reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  #boot h1{font-size:30px;letter-spacing:10px;color:#eafdff;text-shadow:0 0 16px var(--cyan)}
  #bootlog{font-size:12px;color:var(--cyan2);letter-spacing:1px;min-height:60px;text-align:center;line-height:1.7}
  #bootlog .ok{color:var(--green)}
  /* voice equalizer (shows when mic live) */
  .eq{display:none;align-items:flex-end;gap:3px;height:22px;margin-left:6px}
  .eq.live{display:inline-flex}
  .eq i{width:3px;background:var(--cyan);border-radius:2px;animation:eq .9s ease-in-out infinite}
  .eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}
  .eq i:nth-child(4){animation-delay:.45s}.eq i:nth-child(5){animation-delay:.6s}
  @keyframes eq{0%,100%{height:5px}50%{height:22px}}
  #aiStat{padding:3px 10px;border:1px solid var(--line);border-radius:20px;font-weight:700;font-size:11px}
  /* on/off/pause control buttons */
  .ctrlbtn{width:34px;height:30px;border-radius:9px;background:#0c1830;color:var(--cyan);
    border:1px solid var(--line);font-size:15px;line-height:1;transition:.15s}
  .ctrlbtn:hover{box-shadow:0 0 12px var(--cyan);border-color:var(--cyan)}
  .ctrlbtn.power{color:var(--red)}
  .ctrlbtn.power:hover{box-shadow:0 0 12px var(--red);border-color:var(--red)}
  /* PAUSED state: dim the UI + show a banner */
  body.paused .center,body.paused .left,body.paused .right{filter:grayscale(.7) brightness(.7)}
  #pausedBanner{position:fixed;top:74px;left:50%;transform:translateX(-50%);z-index:9999;
    display:none;padding:8px 22px;border-radius:20px;background:#3a1d06;color:#fbbf24;
    border:1px solid #b45309;font-size:13px;letter-spacing:2px;box-shadow:0 0 20px #f59e0b55}
  body.paused #pausedBanner{display:block;animation:pulse 1.8s infinite}
</style>
</head>
<body>

<!-- boot sequence -->
<div id="boot">
  <div class="core"></div>
  <h1>PHANTRON</h1>
  <div id="bootlog"></div>
</div>
<div class="scanlines"></div>
<div id="pausedBanner">⏸ PHANTRON PAUSED — "jaag jao" bolo ya ▶ dabao</div>

<div class="grid">

  <header>
    <div class="logo">
      <div class="orb"></div>
      <div><h1>PHANTRON</h1><small>v7 · P7 BEAST MODE</small></div>
    </div>
    <div class="status">
      <span><span id="conn" class="dot"></span><span id="connTxt">CONNECTING…</span></span>
      <span id="aiStat" title="AI brain status">AI: —</span>
      <span id="osInfo">—</span>
      <span class="clock" id="clock">--:--:--</span>
      <button id="pauseBtn" class="ctrlbtn" title="Pause / Resume PHANTRON">⏸</button>
      <button id="powerBtn" class="ctrlbtn power" title="PHANTRON band karo">⏻</button>
    </div>
  </header>

  <!-- LEFT: system metrics -->
  <div class="left">
    <div class="panel" style="flex:none">
      <h2>System Vitals</h2>
      <div class="gauges">
        <div class="gauge">
          <div class="ring">
            <svg width="70" height="70"><circle cx="35" cy="35" r="30" stroke="#13243f" stroke-width="6" fill="none"/>
            <circle id="cpuRing" cx="35" cy="35" r="30" stroke="#22d3ee" stroke-width="6" fill="none"
              stroke-dasharray="188" stroke-dashoffset="188" stroke-linecap="round"/></svg>
            <div class="val" id="cpuVal">0%</div>
          </div>
          <div class="meta"><b>CPU</b>processor load</div>
        </div>
        <div class="gauge">
          <div class="ring">
            <svg width="70" height="70"><circle cx="35" cy="35" r="30" stroke="#13243f" stroke-width="6" fill="none"/>
            <circle id="ramRing" cx="35" cy="35" r="30" stroke="#38bdf8" stroke-width="6" fill="none"
              stroke-dasharray="188" stroke-dashoffset="188" stroke-linecap="round"/></svg>
            <div class="val" id="ramVal">0%</div>
          </div>
          <div class="meta"><b>RAM</b><span id="ramTxt">— / —</span></div>
        </div>
        <div class="gauge">
          <div class="ring">
            <svg width="70" height="70"><circle cx="35" cy="35" r="30" stroke="#13243f" stroke-width="6" fill="none"/>
            <circle id="batRing" cx="35" cy="35" r="30" stroke="#34d399" stroke-width="6" fill="none"
              stroke-dasharray="188" stroke-dashoffset="188" stroke-linecap="round"/></svg>
            <div class="val" id="batVal">—</div>
          </div>
          <div class="meta"><b>BATTERY</b><span id="batTxt">—</span></div>
        </div>
      </div>
    </div>
    <div class="panel" style="flex:1">
      <h2>Live Screen</h2>
      <div class="screen-wrap">
        <div class="noscreen" id="noscreen">screen feed waiting…</div>
        <img id="screen" style="display:none" alt="live screen">
      </div>
    </div>
  </div>

  <!-- CENTER: chat -->
  <div class="center panel">
    <h2>Conversation</h2>
    <div class="chat" id="chat"></div>
    <div class="inputbar">
      <input id="txt" placeholder="P7, command type karo… (ya mic dabao)" autocomplete="off">
      <span class="eq" id="eq"><i></i><i></i><i></i><i></i><i></i></span>
      <button id="mic" title="Bolo">🎙</button>
      <button id="send">SEND</button>
    </div>
  </div>

  <!-- RIGHT: activity -->
  <div class="right panel">
    <h2>Activity Log</h2>
    <div class="log" id="log"></div>
    <div class="hint">PHANTRON jo kuch karta hai, yahan live dikhega.</div>
  </div>

</div>

<script>
const WS_URL = "ws://localhost:8765";
const $ = id => document.getElementById(id);
const C = 2 * Math.PI * 30; // ring circumference

let ws, reconnectTimer, typingEl = null;

/* ---- boot sequence ---- */
let bootDone = false;
function runBoot(){
  const lines = [
    "[ ok ] Phantron core initialising…",
    "[ ok ] Loading vision module… <span class='ok'>online</span>",
    "[ ok ] Loading autonomous core… <span class='ok'>online</span>",
    "[ ok ] Linking keyboard / mouse I/O… <span class='ok'>online</span>",
    "[ ok ] Establishing neural link ws://localhost…",
  ];
  const box = $("bootlog");
  let i = 0;
  (function next(){
    if(i < lines.length){ box.innerHTML += lines[i++] + "<br>"; setTimeout(next, 360); }
  })();
}
function hideBoot(){
  if(bootDone) return;
  bootDone = true;
  const b = $("boot");
  if(b){ b.classList.add("gone"); setTimeout(()=>b.remove(), 900); }
}
runBoot();
setTimeout(hideBoot, 5000); // fallback: never get stuck on the boot screen

function connect(){
  ws = new WebSocket(WS_URL);
  ws.onopen = () => { setConn(true); };
  ws.onclose = () => { setConn(false); clearTimeout(reconnectTimer); reconnectTimer = setTimeout(connect, 1500); };
  ws.onerror = () => ws.close();
  ws.onmessage = e => handle(JSON.parse(e.data));
}
function setConn(on){
  $("conn").classList.toggle("on", on);
  $("connTxt").textContent = on ? "ONLINE" : "OFFLINE — retry…";
  if(on) hideBoot();
}

function handle(m){
  switch(m.type){
    case "system":      addMsg(m.message, "sys"); break;
    case "user_message":addMsg(m.message, "user", m.source); break;
    case "ai_response": removeTyping(); addMsg(m.message, "ai"); break;
    case "ai_step":     removeTyping(); addMsg(m.message, "step", "step "+(m.step||"")); showTyping(); break;
    case "thinking":    m.state ? showTyping() : removeTyping(); break;
    case "metrics":     updateMetrics(m); break;
    case "screen_update": updateScreen(m.img); break;
    case "activity_update": updateLog(m.log); break;
    case "capabilities": updateCaps(m); break;
    case "state": updateState(m); break;
  }
}

/* ---- on/off/pause control ---- */
let paused = false;
function updateState(m){
  paused = !!m.paused;
  document.body.classList.toggle("paused", paused);
  const b = $("pauseBtn");
  b.textContent = paused ? "▶" : "⏸";
  b.title = paused ? "Resume PHANTRON" : "Pause PHANTRON";
  if(m.online === false){
    setConn(false);
    $("connTxt").textContent = "OFFLINE — PHANTRON band";
  }
}
function sendControl(action){
  if(!ws || ws.readyState !== 1){ alert("PHANTRON se connection nahi hai."); return; }
  ws.send(JSON.stringify({type:"control", action:action}));
}
$("pauseBtn").onclick = () => sendControl(paused ? "resume" : "pause");
$("powerBtn").onclick = () => {
  if(confirm("PHANTRON ko poori tarah band karein? (Wapas chalu karne ke liye run_phantron.bat)"))
    sendControl("shutdown");
};

/* ---- AI / capability status pill ---- */
function updateCaps(m){
  const el = $("aiStat");
  const caps = m.caps || {};
  if(m.ai_online){
    el.textContent = "AI: ONLINE";
    el.style.color = "var(--green)";
    el.title = caps.ai_detail || "AI brain ready";
  } else {
    el.textContent = "AI: OFFLINE";
    el.style.color = "var(--red)";
    el.title = "AI brain off - set up Ollama or a Claude API key. Basic commands still work.";
  }
}

/* ---- chat ---- */
function addMsg(text, cls, tag){
  const d = document.createElement("div");
  d.className = "msg " + cls;
  if(tag){ const t=document.createElement("span"); t.className="tag"; t.textContent=tag.toUpperCase(); d.appendChild(t); }
  d.appendChild(document.createTextNode(text));
  $("chat").appendChild(d);
  $("chat").scrollTop = $("chat").scrollHeight;
}
function showTyping(){
  if(typingEl) return;
  typingEl = document.createElement("div");
  typingEl.className = "typing";
  typingEl.innerHTML = "<span></span><span></span><span></span>";
  $("chat").appendChild(typingEl);
  $("chat").scrollTop = $("chat").scrollHeight;
}
function removeTyping(){ if(typingEl){ typingEl.remove(); typingEl=null; } }

/* ---- send ---- */
function send(){
  const v = $("txt").value.trim();
  if(!v || !ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({message:v, source:"interface"}));
  $("txt").value = "";
}
$("send").onclick = send;
$("txt").addEventListener("keydown", e => { if(e.key==="Enter") send(); });

/* ---- metrics rings ---- */
function ring(el, pct){ $(el).style.strokeDashoffset = C * (1 - Math.max(0,Math.min(100,pct))/100); }
function updateMetrics(m){
  ring("cpuRing", m.cpu); $("cpuVal").textContent = Math.round(m.cpu)+"%";
  ring("ramRing", m.ram); $("ramVal").textContent = Math.round(m.ram)+"%";
  $("ramTxt").textContent = (m.ram_used||"—")+" / "+(m.ram_total||"—");
  ring("batRing", m.battery); $("batVal").textContent = Math.round(m.battery)+"%";
  $("batTxt").textContent = m.charging ? "Charging ⚡" : "On battery";
  $("osInfo").textContent = m.os || "";
}

/* ---- screen ---- */
function updateScreen(b64){
  if(!b64) return;
  const img = $("screen");
  img.src = "data:image/jpeg;base64," + b64;
  img.style.display = "block";
  $("noscreen").style.display = "none";
}

/* ---- activity log ---- */
function updateLog(items){
  if(!items) return;
  const box = $("log"); box.innerHTML = "";
  items.forEach(it => {
    const row = document.createElement("div");
    row.className = "logitem " + (it.type||"info");
    row.innerHTML = `<span class="t">${it.time||""}</span>
      <span class="a">${esc(it.action||"")}${it.detail?`<span class="d">${esc(it.detail)}</span>`:""}</span>`;
    box.appendChild(row);
  });
}
function esc(s){ return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

/* ---- clock ---- */
setInterval(()=>{ $("clock").textContent = new Date().toLocaleTimeString(); }, 1000);

/* ---- browser mic (Web Speech API) ---- */
const mic = $("mic");
let recog = null, listening = false;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if(SR){
  recog = new SR();
  recog.lang = "hi-IN";
  recog.interimResults = false;
  recog.onresult = e => {
    const text = e.results[0][0].transcript;
    $("txt").value = text;
    send();
  };
  recog.onend = () => { listening = false; mic.classList.remove("live"); $("eq").classList.remove("live"); };
  recog.onerror = () => { listening = false; mic.classList.remove("live"); $("eq").classList.remove("live"); };
  mic.onclick = () => {
    if(listening){ recog.stop(); return; }
    try{ recog.start(); listening = true; mic.classList.add("live"); $("eq").classList.add("live"); }catch(_){}
  };
} else {
  mic.title = "Is browser me mic support nahi (Python voice phir bhi chalega)";
  mic.onclick = () => alert("Browser mic support nahi karta. Chrome/Edge use karo, ya terminal/voice se bolo P7.");
}

connect();
</script>
</body>
</html>
